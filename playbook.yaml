- hosts: all
  become: true

  vars:
    server_type: guest
    telegraf_agent_version: 1.36.4-yn
    telegraf_agent_version_patch: 7fe920c9
    telegraf_agent_disable_version: (yn-release-1\\.5)|(v1\\.5\\.0~5d6622e)|(v1\\.5\\.0~yn)
    # Install the Telegraf package from packages shipped in the ansibleserver image.
    telegraf_agent_package_method: offline
    telegraf_agent_package_local_dir: /opt/yunion/ansible-install-pkg
    telegraf_agent_package_state: latest
    # Optional collectors are installed best-effort and enabled only after probing.
    monitor_agent_install_ext_packages: true

  tasks:
    - name: Load shared Cloudpods Telegraf configuration
      include_vars:
        file: "{{ playbook_dir }}/cloudpods-telegraf-vars.json"

    - name: detect-os
      include_role:
        name: detect-os

    - name: Deploy monitor agent for Linux Guest
      include_role:
        name: ansible-telegraf
      vars:
        telegraf_plugins_default: "{{ cloudpods_telegraf_profiles.guest_linux }}"
      when:
        - server_type == "guest"
        - ansible_facts['os_family'] != "Windows"

    - name: Deploy monitor agent for Windows Guest
      include_role:
        name: ansible-telegraf
      vars:
        telegraf_plugins_default: "{{ cloudpods_telegraf_profiles.guest_windows }}"
      when:
        - server_type == "guest"
        - ansible_facts['os_family'] == "Windows"

    - name: Install optional Baremetal collectors (best effort)
      block:
        - name: Install lm-sensors for Baremetal
          include_role:
            name: lm-sensors
        - name: Install smartmontools and nvme-cli for Baremetal
          include_role:
            name: smartmontools
      ignore_errors: yes
      when:
        - server_type == "baremetal"
        - monitor_agent_install_ext_packages | bool

    # Always probe: the tools may already be installed when package installation is skipped.
    - name: Probe optional Baremetal collectors
      include_tasks: tasks/probe_baremetal_collectors.yml
      when: server_type == "baremetal"

    - name: Report optional Baremetal collectors
      debug:
        msg: >-
          lm-sensors {{ 'available' if (monitor_agent_lm_sensors_present | default(false) | bool) else 'not available' }},
          smartmontools {{ 'available' if (monitor_agent_smartmontools_present | default(false) | bool) else 'not available' }};
          only available tools get a telegraf input
      when: server_type == "baremetal"

    - name: Deploy monitor agent for Baremetal
      include_role:
        name: ansible-telegraf
      vars:
        telegraf_plugins_default: >-
          {{ cloudpods_telegraf_profiles.baremetal_linux
             + ([{'plugin': 'sensors', 'config': ['name_prefix = "agent_"']}]
                if (monitor_agent_lm_sensors_present | default(false) | bool) else [])
             + ([{'plugin': 'smart', 'config': ['name_prefix = "agent_"', 'use_sudo = true']}]
                if (monitor_agent_smartmontools_present | default(false) | bool) else []) }}
      when: server_type == "baremetal"
