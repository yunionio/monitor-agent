---
# Every file in bundled_packages_files_dir is installed with offline_package_tool,
# in one invocation so packages that depend on each other still configure.
# Any failure, including an empty directory, falls back to bundled_packages_names.
# bundled_packages_changed is true when either attempt changes the host; a
# skipped package task still counts as unchanged.
- name: Reset bundled package install state
  set_fact:
    bundled_packages_offline_install_failed: false
    bundled_packages_offline_changed: false
    bundled_packages_changed: false
  changed_when: false

- name: Collect bundled package files
  find:
    paths: "{{ bundled_packages_files_dir }}"
    file_type: file
  delegate_to: localhost
  become: false
  register: bundled_packages_found
  failed_when: false
  changed_when: false
  when: bundled_packages_files_dir | default('') | length > 0

- name: Record bundled package files
  set_fact:
    bundled_packages_found_files: "{{ (bundled_packages_found | default({'files': []})).files | default([]) | map(attribute='path') | list }}"
  changed_when: false

- name: Install bundled packages
  when: bundled_packages_found_files | length > 0
  block:
    - name: Create a staging directory for bundled packages
      tempfile:
        state: directory
        prefix: bundled-packages-
      register: bundled_packages_stage
      changed_when: false

    - name: Stage bundled packages
      copy:
        src: "{{ item }}"
        dest: "{{ bundled_packages_stage.path }}/{{ item | basename }}"
        mode: "0644"
      loop: "{{ bundled_packages_found_files }}"
      register: bundled_packages_staged
      changed_when: false

    - name: Install bundled packages with the offline package tool
      command:
        argv: "{{ [offline_package_tool, '-i'] + (bundled_packages_staged.results | map(attribute='dest') | list) }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
        LANG: C
        LC_ALL: C
      register: bundled_packages_offline_install
      changed_when: true

    - name: Record the bundled package install result
      set_fact:
        bundled_packages_offline_changed: "{{ bundled_packages_offline_install.changed | bool }}"
      changed_when: false
  rescue:
    - name: Remember that the bundled package install failed
      set_fact:
        bundled_packages_offline_install_failed: true
      changed_when: false
  always:
    - name: Remove the bundled package staging directory
      file:
        path: "{{ bundled_packages_stage.path }}"
        state: absent
      when: bundled_packages_stage is defined and (bundled_packages_stage.path | default('')) | length > 0
      changed_when: false

- name: Remember that no bundled package is available
  set_fact:
    bundled_packages_offline_install_failed: true
  when: bundled_packages_found_files | length == 0
  changed_when: false

- name: Install packages from the system package manager
  package:
    name: "{{ bundled_packages_names }}"
    state: present
  register: bundled_packages_install_status
  when: bundled_packages_offline_install_failed | bool

- name: Record whether the package installation changed the host
  set_fact:
    bundled_packages_changed: "{{ (bundled_packages_offline_changed | bool) or (bundled_packages_install_status.changed | default(false) | bool) }}"
  changed_when: false
