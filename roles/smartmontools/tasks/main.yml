---
# Installation is best effort: it is skipped when smartctl is already usable
# and the sudo privilege is only injected when smartctl really is, since the
# telegraf smart input is configured with use_sudo. Offline hosts install the
# debs under files/ via bundled-packages. Online hosts install the distro packages.
- name: Check whether smartctl is already available
  shell: command -v smartctl
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  register: smartmontools_probe
  changed_when: false
  failed_when: false

# Captured here because role_path belongs to this role. Inside
# bundled-packages, role_path points at that role.
- name: Record the smartmontools files directory
  set_fact:
    smartmontools_files_dir: "{{ role_path }}/files/{{ offline_os_name }}"
  changed_when: false

- name: Install smartmontools and nvme-cli from bundled packages
  include_role:
    name: bundled-packages
  vars:
    bundled_packages_files_dir: "{{ smartmontools_files_dir }}"
    bundled_packages_names:
      - sudo
      - smartmontools
      - nvme-cli
  when:
    - smartmontools_probe.rc | default(1) | int != 0
    - not (online_status | default(true) | bool)

- name: Install smartmontools and nvme-cli
  package:
    name:
      - sudo
      - smartmontools
      - nvme-cli
    state: present
  when:
    - smartmontools_probe.rc | default(1) | int != 0
    - online_status | default(true) | bool

- name: Check whether smartctl is usable after the installation attempt
  shell: command -v smartctl
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  register: smartmontools_smartctl_probe
  changed_when: false
  failed_when: false

- name: Inject telegraf smart sudo privilege
  copy:
    src: 100-telegraf-smart
    dest: /etc/sudoers.d/100-telegraf-smart
    owner: root
    group: root
    mode: 0400
  when: smartmontools_smartctl_probe.rc | default(1) | int == 0
