---

- name: "Probe whether the distribution repository is reachable for {{ ansible_distribution }} {{ ansible_distribution_major_version }} {{ ansible_distribution_minor_version }}"
  include_tasks: "{{ item }}"
  with_first_found:
    - files:
        - "os/{{ ansible_distribution | lower }}.yml"
        - os/default.yml
      paths:
        - "{{ role_path }}/tasks"
